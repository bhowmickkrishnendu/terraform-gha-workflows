name: Terraform Apply Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      component:
        required: true
        type: string
      root_directory:
        required: false
        type: string
        default: ""
      aws_region:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.14.2"
      approval_environment:
        required: true
        type: string
      expected_plan_sha256:
        required: true
        type: string

    secrets:
      TF_PLAN_PASSPHRASE:
        description: Same passphrase used when the saved plan was encrypted
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.approval_environment }}
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      TF_ROOT: ${{ inputs.root_directory != '' && inputs.root_directory || format('environments/{0}/{1}', inputs.environment, inputs.component) }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_COMPONENT: ${{ inputs.component }}

    steps:
      - name: Require a trusted branch event
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CALLER_EVENT" in
            push|workflow_dispatch|schedule) ;;
            *) echo "::error::Live Terraform workflows cannot run on PR events."; exit 1 ;;
          esac
          test -n "$DEFAULT_BRANCH"
          [[ "$CALLER_REF" == "refs/heads/$DEFAULT_BRANCH" ]]

      - name: Require configured reviewers for this stack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_ENVIRONMENT: ${{ inputs.approval_environment }}
        run: |
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/$APPROVAL_ENVIRONMENT" \
            | jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))'

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Confirm this is the latest merged commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$current_sha" = "$GITHUB_SHA"

      - name: Validate Terraform root and inputs
        run: |
          set -euo pipefail
          [[ "$TF_COMPONENT" =~ ^[A-Za-z0-9_-]+$ ]]
          workspace=$(realpath "$GITHUB_WORKSPACE")
          root=$(realpath -e "$TF_ROOT")
          [[ "$root" == "$workspace/"* ]]
          test -f "$root/.terraform.lock.hcl"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Verify AWS session
        run: aws sts get-caller-identity > /dev/null

      - name: Initialize Terraform
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false -lockfile=readonly

      - name: Download saved plan from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_attempt }}
          path: ${{ env.TF_ROOT }}

      - name: Decrypt saved plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test "${#TF_PLAN_PASSPHRASE}" -ge 32
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:TF_PLAN_PASSPHRASE -in tfplan.enc -out tfplan

      - name: Verify saved plan digest
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        env:
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
        run: |
          [[ "$EXPECTED_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual_sha=$(sha256sum tfplan | cut -d ' ' -f1)
          test "$actual_sha" = "$EXPECTED_PLAN_SHA256"

      - name: Apply reviewed plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -no-color -input=false -lock-timeout=5m tfplan

      - name: Show applied state outputs
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          terraform output -no-color | tee "$RUNNER_TEMP/terraform-outputs.txt"
          {
            echo "### $TF_COMPONENT applied state outputs"
            echo '```text'
            cat "$RUNNER_TEMP/terraform-outputs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
