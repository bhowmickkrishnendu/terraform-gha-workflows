name: Terraform Apply Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      component:
        required: true
        type: string

      aws_region:
        required: true
        type: string

      role_to_assume:
        required: true
        type: string

      terraform_version:
        required: false
        type: string
        default: "1.14"

      tfvars_file:
        required: false
        type: string
    # secrets:
    #   SYS_PUBKEY:
    #     required: true

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}/${{ inputs.component }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Terraform Init
        run: terraform init -input=false

      # ── State lock guard ──────────────────────────────────────────────────────
      # If a previous run died mid-apply it can leave a stale DynamoDB lock.
      # This step detects the lock ID from the error output and force-unlocks it
      # so the current run can proceed cleanly.
      - name: Force Unlock State (if locked)
        id: force-unlock
        run: |
          LOCK_OUTPUT=$(terraform plan -input=false -lock-timeout=10s 2>&1 || true)
          if echo "$LOCK_OUTPUT" | grep -q "Error acquiring the state lock"; then
            LOCK_ID=$(echo "$LOCK_OUTPUT" | grep -oP '(?<=ID:\s{8})[0-9a-f-]{36}' | head -1)
            if [ -n "$LOCK_ID" ]; then
              echo "::warning::Stale state lock detected (ID: $LOCK_ID). Force-unlocking..."
              terraform force-unlock -force "$LOCK_ID"
              echo "unlocked=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::State is locked but could not extract Lock ID. Check the state manually."
              exit 1
            fi
          else
            echo "unlocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.component }}
          path: environments/${{ inputs.environment }}/${{ inputs.component }}

      - name: Terraform Apply
        # env:
        #   TF_VAR_public_key: ${{ secrets.SYS_PUBKEY }}
        run: terraform apply -input=false tfplan