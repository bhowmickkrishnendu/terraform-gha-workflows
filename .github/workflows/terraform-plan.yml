name: Terraform Plan Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      component:
        required: true
        type: string
      root_directory:
        required: false
        type: string
        default: ""
      aws_region:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.14.2"
      tfvars_file:
        required: true
        type: string
      upload_plan:
        required: false
        type: boolean
        default: true
    outputs:
      has_changes:
        description: Whether the saved plan contains changes
        value: ${{ jobs.terraform.outputs.has_changes }}
      plan_sha256:
        description: SHA256 of the saved binary plan
        value: ${{ jobs.terraform.outputs.plan_sha256 }}

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    env:
      TF_ROOT: ${{ inputs.root_directory != '' && inputs.root_directory || format('environments/{0}/{1}', inputs.environment, inputs.component) }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Verify AWS session
        run: aws sts get-caller-identity > /dev/null

      - name: Check format
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate -no-color

      - name: Save and summarize plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform plan -no-color -detailed-exitcode -input=false \
            -out=tfplan -var-file="${{ inputs.tfvars_file }}" \
            2>&1 | tee "$RUNNER_TEMP/terraform-plan.txt"
          plan_exit=${PIPESTATUS[0]}
          set -e
          if [ "$plan_exit" -ne 0 ] && [ "$plan_exit" -ne 2 ]; then
            echo "::error::Terraform plan failed; inspect the output above."
            exit 1
          fi
          if [ "$plan_exit" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Apply will be skipped for this stack."
          fi
          echo "plan_sha256=$(sha256sum tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.component }} plan"
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "Plan exit code: $plan_exit (0 = no changes, 2 = changes)"
            echo '```text'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show current state outputs
        working-directory: ${{ env.TF_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          terraform output -no-color | tee "$RUNNER_TEMP/terraform-outputs.txt"
          {
            echo "### ${{ inputs.component }} current state outputs"
            echo "These values are from state before apply. Proposed output changes appear in the plan above."
            echo '```text'
            cat "$RUNNER_TEMP/terraform-outputs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sensitive plan for apply
        if: steps.plan.outputs.has_changes == 'true' && inputs.upload_plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.component }}
          path: ${{ env.TF_ROOT }}/tfplan
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
