name: Terraform Plan Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      component:
        required: true
        type: string
      root_directory:
        required: false
        type: string
        default: ""
      aws_region:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.14"
      tfvars_file:
        required: true
        type: string
    secrets:
      INFRACOST_API_KEY:
        required: true
      # SYS_PUBKEY:
      #   required: true

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_ROOT: ${{ inputs.root_directory != '' && inputs.root_directory || format('environments/{0}/{1}', inputs.environment, inputs.component) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate -no-color

      # === SECURITY & QUALITY GATES ===
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize TFLint
        working-directory: ${{ env.TF_ROOT }}
        run: tflint --init

      - name: Run TFLint
        working-directory: ${{ env.TF_ROOT }}
        run: tflint --format compact --color
        continue-on-error: true

      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_ROOT }}
          soft_fail: false  # Fail pipeline on security issues

      # === END SECURITY GATES ===

      - name: Terraform Plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            -var-file="${{ inputs.tfvars_file }}"
        # env:
        #   TF_VAR_public_key: ${{ secrets.SYS_PUBKEY }}

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.component }}
          path: ${{ env.TF_ROOT }}/tfplan

      - name: Setup Infracost
        uses: infracost/actions/setup@v3

      - name: Generate Infracost Breakdown
        working-directory: ${{ env.TF_ROOT }}
        run: |
          infracost breakdown \
            --path . \
            --terraform-var-file="${{ inputs.tfvars_file }}" \
            --format table
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
